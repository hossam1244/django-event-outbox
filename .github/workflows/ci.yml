name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: py${{ matrix.python }} · dj${{ matrix.django }} · drf${{ matrix.drf }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
        django: ["4.2", "5.1", "5.2"]
        drf: ["3.15", "3.16"]
        exclude:
          - python: "3.13"
            django: "4.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "django~=${{ matrix.django }}.0" "djangorestframework~=${{ matrix.drf }}.0" pytest pytest-django pytest-mock coverage
      - run: pip install -e .
      - name: Run tests with coverage
        run: |
          coverage run -m pytest --tb=short
          coverage report
          coverage report --fail-under=90
