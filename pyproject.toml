[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-event-outbox"
version = "0.1.0"
description = "Transactional outbox for Django: emit events in the same transaction as your writes, relay them reliably with retries and locking."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hossam Rakha" }]
keywords = ["django", "outbox", "events", "transactional", "webhooks", "celery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = ["django>=4.2"]

[project.urls]
Repository = "https://github.com/hossam1244/django-event-outbox"

[dependency-groups]
dev = ["djangorestframework>=3.15", "pytest>=8", "pytest-django>=4.8", "ruff>=0.6", "coverage>=7.6", "pytest-mock>=3.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/django_event_outbox"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["django_event_outbox"]
command_line = "-m pytest"

[tool.coverage.report]
show_missing = true
